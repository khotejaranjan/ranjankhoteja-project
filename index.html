<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life of a Zebra</title>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
    <div class="introductionScreen screen">
        <!-- Introduction screen  -->
        <h1>Life of a zebra</h1>
        <p>Use your arrow keys:</p>
        <ul>
            <li>⬅️ - face back</li>
            <li>⬆️ - move up </li>
            <li>⬇️ - move down</li>
            <li>➡️ - forward</li>
        </ul>
        <button class="startBtn">Start ▶️</button>
        
    </div>
    <div class="levelOneScreen screen">
        <!-- Level One screen content  -->
<audio class="zebraSound" src="./sounds/zebrasound.mp3"></audio>
<audio class="lionSound" src="./sounds/lionsound.mp3"></audio>
        <div class="timer">30</div>
        <div class="score">Score: 0</div>
        <div class="best">Best: 0</div>
        <div class="message hidden"></div>
         <button class="tryAgainBtn hidden">Try again 🔁</button>
    </div>

    <div class="finalScreen screen">
        <!-- Final screen content  -->
        <h1>Another day of being alive </h1>
            <p class="finalScore">I lived for: 0 days</p>
        <button class="playAgain"> Play Again</button>
    </div>
    <script src="./js/lion.js"></script>
    <script src="./js/zebra.js"></script>
    <script src="./js/levelone.js"></script>
    <script src="./js/index.js"></script>  
</body>
</html>
